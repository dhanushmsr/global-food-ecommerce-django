{% extends 'booking/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 bg-white border-0 shadow-sm">
            <h4 class="fw-bold mb-4 text-dark">🛒 Select Checkout & Payment Infrastructure</h4>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Fulfillment Address Delivery Target</label>
                    <textarea name="address" class="form-control" rows="2" required>{{ profile.address }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Callback Phone Reference</label>
                    <input type="tel" name="phone" class="form-control" value="{{ profile.phone_number }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Order Servicing Units (Quantity)</label>
                    <input type="number" name="quantity" class="form-control" value="1" min="1" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary">Choose Verified Premium Payment Channel</label>
                    <div class="form-check p-3 border rounded mb-2 bg-light">
                        <input class="form-check-input ms-1" type="radio" name="payment_method" value="PAYPAL" id="p1" required>
                        <label class="form-check-label ms-2" for="p1"><b>PayPal Platform</b> 💳</label>
                    </div>
                    <div class="form-check p-3 border rounded mb-2 bg-light">
                        <input class="form-check-input ms-1" type="radio" name="payment_method" value="CARD" id="p2">
                        <label class="form-check-label ms-2" for="p2"><b>Credit / Debit Bank Card Processing</b> 🏦</label>
                    </div>
                    <div class="form-check p-3 border rounded mb-2 bg-light">
                        <input class="form-check-input ms-1" type="radio" name="payment_method" value="COD" id="p3" checked>
                        <label class="form-check-label ms-2" for="p3"><b>Cash on Delivery (COD Service)</b> 💵</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-3 fw-bold">AUTHORIZE HOTEL ORDER TRANSACTION</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
