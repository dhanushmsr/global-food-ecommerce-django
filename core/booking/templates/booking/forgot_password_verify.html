{% extends 'booking/base.html' %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card p-4 bg-white border-0 shadow" style="border-radius: 16px;">
            <div class="text-center mb-4">
                <h4 class="fw-bold text-dark" style="font-family: 'Georgia', serif;">📝 Reset Security Access</h4>
                <hr style="border-top: 1px dashed #dee2e6;">
            </div>

            {% if error %}
                <div class="alert alert-danger py-2 small text-center">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Enter SMS OTP Code</label>
                    <input type="text" name="otp" class="form-control text-center font-monospace fw-bold fs-5" placeholder="000000" maxlength="6" required style="border-radius: 8px;">
                </div>
                
                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">New Secure Password</label>
                    <div class="input-group">
                        <input type="password" id="resetPassword" name="new_password" class="form-control" placeholder="Minimum 8 characters" required style="border-top-left-radius: 8px; border-bottom-left-radius: 8px;">
                        <button type="button" class="input-group-text bg-light" onclick="togglePasswordVisibility('resetPassword', 'resetEyeIcon')">
                            <i id="resetEyeIcon" class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-dark w-100 fw-bold py-2 text-uppercase" style="border-radius: 8px;">Update Access Keys</button>
            </form>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, iconId) {
    const passwordField = document.getElementById(inputId);
    const eyeIcon = document.getElementById(iconId);
    if (passwordField.type === "password") {
        passwordField.type = "text";
        eyeIcon.classList.remove("bi-eye");
        eyeIcon.classList.add("bi-eye-slash");
    } else {
        passwordField.type = "password";
        eyeIcon.classList.remove("bi-eye-slash");
        eyeIcon.classList.add("bi-eye");
    }
}
</script>
{% endblock %}
