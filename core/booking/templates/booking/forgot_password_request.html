{% extends 'booking/base.html' %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card p-4 bg-white border-0 shadow" style="border-radius: 16px;">
            <div class="text-center mb-3">
                <h4 class="fw-bold text-dark" style="font-family: 'Georgia', serif;">🔑 Password Recovery</h4>
                <p class="text-muted small">Verify your phone log to update configuration keys</p>
                <hr style="border-top: 1px dashed #dee2e6;">
            </div>

            {% if error %}
                <div class="alert alert-danger py-2 small text-center">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">Registered Phone Number</label>
                    <input type="text" name="phone" class="form-control" placeholder="e.g. 01761234567" required style="border-radius: 8px;">
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold py-2 text-uppercase" style="border-radius: 8px;">Send Reset OTP</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
